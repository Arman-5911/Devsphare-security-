version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: devsphere
      POSTGRES_PASSWORD: devsphere_secure_password
      POSTGRES_DB: devsphere_security
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsphere -d devsphere_security"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: devsphere-api
    restart: always
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://devsphere:devsphere_secure_password@postgres:5432/devsphere_security
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: devsphere-web
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
